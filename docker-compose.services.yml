name: agentforge-services

# Sprint 5.0 microservices: core (platform) + autoparts (domain) with
# separate databases. Build context is ./backend so each Dockerfile can
# install the shared contract package. Runtime env mirrors the monolith:
# ollama/redis/mailhog stay shared across both services.

services:
  db-core:
    image: postgres:16-alpine
    container_name: agentos-db-core
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos_core}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos_secret}
    ports:
      - "${POSTGRES_CORE_PORT:-5433}:5432"
    volumes:
      - pgdata_core:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-autoparts:
    image: postgres:16-alpine
    container_name: agentos-db-autoparts
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos_autoparts}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos_secret}
    ports:
      - "${POSTGRES_AUTOPARTS_PORT:-5434}:5432"
    volumes:
      - pgdata_autoparts:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agentos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: agentos-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: agentos-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  core-api:
    build:
      context: ./backend
      dockerfile: services/core/Dockerfile
    container_name: agentos-core-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-agentos_secret}@db-core:5432/${POSTGRES_DB:-agentos_core}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b}
      DEFAULT_AGENT_MODEL: ${DEFAULT_AGENT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-agentforge@agentos.local}
      EMAIL_DEFAULT_TO: ${EMAIL_DEFAULT_TO:-demo@agentos.local}
      JWT_SECRET: ${JWT_SECRET:-dev-only-agentforge-jwt-secret-change-me-9f3a1c}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@agentos.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTOPARTS_INTERNAL_URL: http://autoparts-api:8010
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
    ports:
      - "${CORE_API_PORT:-8010}:8000"
    depends_on:
      db-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      autoparts-api:
        condition: service_started

  autoparts-api:
    build:
      context: ./backend
      dockerfile: services/autoparts/Dockerfile
    container_name: agentos-autoparts-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-agentos_secret}@db-autoparts:5432/${POSTGRES_DB:-agentos_autoparts}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b}
      DEFAULT_AGENT_MODEL: ${DEFAULT_AGENT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-agentforge@agentos.local}
      EMAIL_DEFAULT_TO: ${EMAIL_DEFAULT_TO:-demo@agentos.local}
      JWT_SECRET: ${JWT_SECRET:-dev-only-agentforge-jwt-secret-change-me-9f3a1c}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@agentos.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
    ports:
      - "${AUTOPARTS_API_PORT:-8011}:8000"
    depends_on:
      db-autoparts:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mailhog:
        condition: service_healthy

volumes:
  pgdata_core:
  pgdata_autoparts:
  ollama: