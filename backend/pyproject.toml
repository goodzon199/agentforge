[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (undefined names, unused imports, …)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern syntax)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # misc. style
    "TRY",    # try/except style
    "RUF",    # ruff-specific
    "DTZ",    # naive datetime checks
]
ignore = [
    "E501",  # long lines: existing style keeps prose-heavy lines unwrapped
    "EXE002",  # exec-bit flag from git on Windows; not a code issue
    # Ambiguous-unicode checks: the product intentionally uses Cyrillic text
    # in strings, comments and identifiers (Russian-language UI/errors).
    "RUF001",
    "RUF002",
    "RUF003",
    # Long/verbose exception messages are deliberate here (descriptive
    # Russian error text surfaced to users / support).
    "TRY003",
    # Specificity codes on `# type: ignore` are nice-to-have, not required.
    "UP042",
    # Moving statements into `else` of try/except is stylistic; skipping
    # avoids subtle behavior changes in cleanup-heavy code.
    "TRY300",
    "TRY301",
]

# FastAPI/Starlette register dependencies as default-argument function calls.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Response",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy 2.0 string forward-references in Mapped[...] resolve at runtime;
# F821 is a false positive for them.
"app/models/*.py" = ["F821"]
# Test helpers unpack multi-value fixtures; unused unpacked names are noise.
"tests/*.py" = ["RUF059"]
# Resilience layer intentionally degrades silently when Redis is unreachable
# (calls return None instead of raising) — blind except + pass is the contract.
"app/core/redis.py" = ["BLE001", "S110"]
"app/core/rate_limit.py" = ["BLE001", "S110"]
"app/reliability/circuit_breaker.py" = ["BLE001"]
"app/llm/client.py" = ["BLE001"]
"app/services/analytics_service.py" = ["BLE001"]
"app/agents/intake_agent.py" = ["BLE001"]
"app/agents/system.py" = ["BLE001"]

